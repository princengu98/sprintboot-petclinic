
name: Build and test Java App

on: { push: {branches: ["main"]} , pull_request: {branches: ["main"]}}

jobs:
    Build_and_test:
        runs-on: ubuntu-latest

        steps:
            - name: checkout_repo
              uses: actions/checkout@v4

            - name: set_up_JDK 8
              uses: actions/setup-java@v4
              with:
                java-version: '8'
                distribution: 'temurin'
                cache: 'maven' 

            - name: Compile Application
              run: mvn clean package -DskipTests=true

            - name: Run Unit Tests
              run: mvn surefire:test

            # Step 5: Process test reports (Replaces Jenkins 'post { junit ... }' block)
            - name: Publish Test Report
              uses: scacap/action-surefire-report@v1
              if: always() # Ensures reports are published even if tests fail
              with:
                report_paths: '**/target/surefire-reports/TEST-*.xml'


      # Step 6: Initialize Docker BuildKit
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

      # Step 7: Build image locally (Replaces Jenkins 'docker build' stage)
            - name: Build Docker image
              uses: docker/build-push-action@v6
              with:
                context: .
                file: ./Dockerfile
                push: false # Does not push to AWS ECR
                tags: demomk:latest
                cache-from: type=gha
                cache-to: type=gha,mode=max